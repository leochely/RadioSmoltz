[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiosmoltz-client"
version = "0.1.2"
description = "Client RadioSmoltz - VOIP de proximite pour Star Citizen."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "websockets>=12,<14",
    "numpy>=1.26",
    "scipy>=1.11",
    "mss>=9",
    "opencv-python>=4.9",
    "easyocr>=1.7",
    "sounddevice>=0.4",
    "cryptography>=42",
    "pynput>=1.7",
]

[tool.setuptools]
py-modules = [
    "radiosmoltz_client",
    "radiosmoltz_core",
    "radiosmoltz_audio_io",
    "radiosmoltz_sc_ocr",
]
