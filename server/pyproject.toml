[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiosmoltz-server"
version = "0.1.1"
description = "Serveur WebSocket pour RadioSmoltz - positions + audio relay."
requires-python = ">=3.10"
dependencies = [
    "websockets>=12,<14",
    "cryptography>=42",
]

[tool.setuptools]
py-modules = [
    "radiosmoltz_server",
    "radiosmoltz_audio_server",
    "radiosmoltz_security",
    "radiosmoltz_server_config",
    "radiosmoltz_admin",
]
